<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine Question 💌</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    h1 {
      color: #fff;
      text-align: center;
      padding: 0 15px;
      margin-bottom: 30px;
    }

    p {
      color: #fff;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .box {
      position: relative;
      width: 320px;
      height: 160px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    #yes {
      background-color: #28a745;
      color: white;
    }

    #no {
      position: absolute;
      background-color: #dc3545;
      color: white;
      left: 180px;
      top: 70px;
    }
  </style>
</head>
<body>

  <p>— from Gourrii 💌</p>

  <h1>Will u be my Pussy cat 😸👀🫶🏻 for this Valentine?</h1>

  <div class="box">
    <button id="yes" onclick="yesClicked()">YES 😍</button>
    <button id="no" onmouseover="moveNo()">NO 🙈</button>
  </div>

  <script>
    function moveNo() {
      const noBtn = document.getElementById("no");
      const maxX = 250;
      const maxY = 120;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function yesClicked() {
      document.body.innerHTML = `
        <h1>Hehe 😻 I knew it!</h1>
        <p>This Valentine just got pawsome 💖</p>
      `;
    }
  </script>

</body>
</html>
